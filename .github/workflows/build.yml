name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Work out the TV page address
        env:
          CUSTOM_URL: ${{ vars.TV_URL }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -n "$CUSTOM_URL" ]; then url="$CUSTOM_URL"
          elif [ "${repo,,}" = "$owner.github.io" ]; then url="https://$owner.github.io/tv.html"
          else url="https://$owner.github.io/$repo/tv.html"; fi
          echo "TV_URL=$url" >> "$GITHUB_ENV"
          echo "The app will open: $url"

      - name: Build the Fire Stick app
        run: gradle -p android assembleRelease -PtvUrl="$TV_URL" -PversionCode=${{ github.run_number }}

      - name: Put the site together
        run: |
          mkdir site
          cp -r web/* site/
          cp android/app/build/outputs/apk/release/app-release.apk site/gym.apk
          echo "Download the app on the Fire Stick from: ${TV_URL%tv.html}gym.apk" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: gym-tv-apk
          path: site/gym.apk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
