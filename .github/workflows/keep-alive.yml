name: Keep database awake

# Free Supabase projects pause after a week with no activity.
# This checks in once a day so the gym app is always ready.
on:
  schedule:
    - cron: '17 6 * * *'   # every day at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node .github/scripts/keep-alive.mjs
